name: Publish Netflix Weekly Top 10

on:
  schedule:
    # Every Friday at 19:00 in Asia/Shanghai, expressed in UTC.
    - cron: "0 11 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      PUBLIC_NETFLIX_PAGE_URL: ${{ vars.PUBLIC_NETFLIX_PAGE_URL }}
      PUBLIC_PAGE_URL: ${{ vars.PUBLIC_PAGE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji && sudo fc-cache -f
      - name: Install browser
        run: PLAYWRIGHT_BROWSERS_PATH=.ms-playwright npx playwright install --with-deps chromium
      - name: Capture Netflix ranking images
        run: |
          PLAYWRIGHT_BROWSERS_PATH=.ms-playwright node scripts/capture-netflix-page.js --chart global --output outputs/netflix-top10-global.png
          PLAYWRIGHT_BROWSERS_PATH=.ms-playwright node scripts/capture-netflix-page.js --chart us --output outputs/netflix-top10-us.png
      - name: Publish to Telegram
        run: node scripts/publish-netflix-telegram.js --global outputs/netflix-top10-global.png --us outputs/netflix-top10-us.png
